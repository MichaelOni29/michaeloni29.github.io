name: Update publications

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 05:17 South Africa time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch publications
        env:
          SCHOLAR_ID: ${{ vars.SCHOLAR_ID }}
          ORCID_ID: ${{ vars.ORCID_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_publications.py

      - name: Commit if changed
        run: |
          git config user.name "publications-bot"
          git config user.email "actions@users.noreply.github.com"
          git add publications.json
          git diff --cached --quiet || git commit -m "Update publications"
          git push
